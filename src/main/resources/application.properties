spring.application.name=vetflow

# H2 (desenvolvimento) - agora com base de dados persistida em arquivo para o Flyway manter estado entre execuções
spring.datasource.url=jdbc:h2:file:./data/vetflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# ddl-auto=validate garante que as entidades JPA batem com o schema criado pelo Flyway.
# O Flyway é a única fonte de verdade sobre a estrutura do banco a partir de agora.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Cache
spring.cache.type=simple

# Thymeleaf
spring.thymeleaf.cache=false
