<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetFlow — Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 8vh;">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">🐾 VetFlow</h1>
        <p class="text-muted">Jornada contínua de saúde do pet</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-3">Entrar</h5>

            <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos.</div>
            <div th:if="${param.logout}" class="alert alert-info">Você saiu da sua conta.</div>
            <div th:if="${param.registered}" class="alert alert-success">Cadastro realizado! Faça login.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                Ainda não tem conta? <a th:href="@{/register}">Cadastre-se como tutor</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
