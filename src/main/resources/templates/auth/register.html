<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetFlow — Criar conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 480px; margin-top: 6vh;">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">🐾 VetFlow</h1>
        <p class="text-muted">Criar conta de tutor</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/register}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nome completo</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="(11) 99999-9999" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Criar conta</button>
            </form>

            <hr>
            <p class="text-center mb-0">
                Já tem conta? <a th:href="@{/login}">Entrar</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
