<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetFlow — Registrar Vacina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/web/dashboard}">🐾 VetFlow</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:text="${user.name}"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 560px;">
    <a class="btn btn-outline-secondary btn-sm mb-3" th:href="@{/web/pets/{id}(id=${pet.id})}">&larr; Voltar</a>

    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="mb-1">Registrar vacina aplicada</h4>
            <p class="text-muted">Pet: <strong th:text="${pet.name}"></strong></p>

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/web/vaccines/apply/{id}(id=${pet.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nome da vacina</label>
                    <input type="text" name="vaccineName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data de aplicação</label>
                    <input type="date" name="appliedAt" class="form-control" th:value="${today}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Data da próxima dose</label>
                    <input type="date" name="nextDoseAt" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Lote</label>
                    <input type="text" name="batch" class="form-control">
                </div>
                <button type="submit" class="btn btn-success w-100">Confirmar aplicação</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
