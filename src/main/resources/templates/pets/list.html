<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetFlow — Pets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/web/dashboard}">🐾 VetFlow</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:text="${user.name}"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Pets</h2>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="pet : ${pets}">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${pet.name}"></h5>
                    <p class="card-text">
                        <span class="badge bg-secondary" th:text="${pet.species}"></span>
                        <span class="text-muted" th:text="${pet.breed}"></span>
                    </p>
                    <p class="card-text text-muted small" th:text="'Tutor: ' + ${pet.tutor.name}"></p>
                    <a class="btn btn-primary btn-sm" th:href="@{/web/pets/{id}(id=${pet.id})}">Ver detalhes</a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(pets)}">
            <p class="text-muted">Nenhum pet encontrado.</p>
        </div>
    </div>
</div>
</body>
</html>
