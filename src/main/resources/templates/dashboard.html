<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VetFlow — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/web/dashboard}">🐾 VetFlow</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:text="${user.name} + ' (' + ${user.role} + ')'"></span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/web/pets}">Pets</a>
            <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                <button type="submit" class="btn btn-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Olá, <span th:text="${user.name}"></span> 👋</h2>

    <!-- Visão do TUTOR -->
    <div th:if="${pets != null}">
        <h4>Seus pets</h4>
        <div class="row">
            <div class="col-md-4 mb-3" th:each="pet : ${pets}">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${pet.name}"></h5>
                        <p class="card-text text-muted" th:text="${pet.species} + ' — ' + ${pet.breed}"></p>
                        <a class="btn btn-primary btn-sm" th:href="@{/web/pets/{id}(id=${pet.id})}">Ver detalhes</a>
                    </div>
                </div>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(pets)}">
                <p class="text-muted">Você ainda não tem pets cadastrados.</p>
            </div>
        </div>
    </div>

    <!-- Visão do VET -->
    <div th:if="${pendingAppointments != null}">
        <div class="row">
            <div class="col-md-6">
                <h4>Agendamentos pendentes</h4>
                <ul class="list-group mb-4">
                    <li class="list-group-item" th:each="a : ${pendingAppointments}">
                        <strong th:text="${a.pet.name}"></strong> —
                        <span th:text="${a.type}"></span> em
                        <span th:text="${#temporals.format(a.scheduledAt, 'dd/MM/yyyy HH:mm')}"></span>
                        (<span th:text="${a.clinic.name}"></span>)
                    </li>
                    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(pendingAppointments)}">
                        Nenhum agendamento pendente.
                    </li>
                </ul>
            </div>
            <div class="col-md-6">
                <h4>Vacinas vencidas</h4>
                <ul class="list-group mb-4">
                    <li class="list-group-item" th:each="v : ${expiredVaccines}">
                        <strong th:text="${v.pet.name}"></strong> —
                        <span th:text="${v.vaccineName}"></span>
                        (venceu em <span th:text="${#temporals.format(v.nextDoseAt, 'dd/MM/yyyy')}"></span>)
                    </li>
                    <li class="list-group-item text-muted" th:if="${#lists.isEmpty(expiredVaccines)}">
                        Nenhuma vacina vencida.
                    </li>
                </ul>
            </div>
        </div>
        <a class="btn btn-primary" th:href="@{/web/pets}">Ver todos os pets</a>
    </div>
</div>
</body>
</html>
